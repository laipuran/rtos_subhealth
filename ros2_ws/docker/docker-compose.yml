# ROS2 Foxy 容器化编译/运行环境
# 用法: 见同目录 dev.sh（推荐）或直接 `docker compose run --rm app <cmd>`
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rtos-subhealth:foxy-dev
    container_name: rtos-subhealth-dev
    # host 网络必需：DDS 绑定 lo + WebUI 访问 localhost:5000
    network_mode: host
    environment:
      # Cyc/une DDS 与 domain，与 setup.sh 保持一致（lo 绑定已在 setup.sh 内设置）
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: "1"
      # 兼容无 unitree_* 目录：setup.sh 中按存在性判断，缺失会自动跳过
    volumes:
      # bind mount 源码工作空间；build/ install/ log/ 已在 .gitignore，产物留在宿主以便增量与查看
      - ./..:/workspace
    working_dir: /workspace
    entrypoint: ["./docker/entrypoint.sh"]
