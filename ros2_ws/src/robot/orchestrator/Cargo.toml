[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[dependencies]
rclrs = "0.7"
anyhow = "1"
futures = "0.3"
serde_json = "1"
orchestrator-core = { path = "../../../../services/orchestrator-core" }
device_interfaces = { version = "0.1" }
task_interfaces = { version = "0.1" }
geometry_msgs = "*"
builtin_interfaces = "*"
