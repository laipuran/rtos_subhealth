[package]
name = "gateway_bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gateway_bridge"
path = "src/main.rs"

[dependencies]
rclrs = "0.7"
anyhow = "1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gateway = { path = "../../../../services/gateway" }
task_interfaces = { version = "0.1" }
device_interfaces = { version = "0.1" }
std_msgs = "*"
geometry_msgs = "*"
builtin_interfaces = "*"
