# RAUC A/B update configuration for the external control PC.
#
# The control PC boots a slot-based rootfs (A/B). This file declares the
# bootloader backend, the two slots, and a separate data partition that holds
# state surviving OTA updates (SQLite, maps, logs, calibration).
#
# See: https://rauc.readthedocs.io/en/latest/reference.html
[system]
compatible=ros-subhealth-controlpc
bootloader=grub
# For U-Boot instead: bootloader=uboot

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs.0
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs.1
type=ext4
bootname=B

# Persistent, never part of the A/B image. Mounted at /var/lib/ros.
[slot.data.0]
device=/dev/disk/by-partlabel/data
type=ext4

[slot.bootloader.0]
device=/dev/disk/by-partlabel/boot.0
type=ext4
bootname=A

[slot.bootloader.1]
device=/dev/disk/by-partlabel/boot.1
type=ext4
bootname=B
